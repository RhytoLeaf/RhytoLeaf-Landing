<!doctype html>
<html lang="en">

      body {

      .card {
        text-align: center;
        max-width: 520px;
      }
      .leaf {
        width: 64px;

        object-fit: contain;

        display: flex;
        gap: 12px;

        flex-wrap: wrap;

        border-radius: 100px;
        padding: 12px 24px;
